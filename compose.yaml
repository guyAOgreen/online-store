# Runs the published image (or a local build with --build) against PostgreSQL (#11).
#
#   docker compose up            pulls ghcr.io/guyaogreen/online-store:latest
#   docker compose up --build    builds the image from this checkout instead
#
# The database is also published on localhost:5433 with the README's credentials, so `./gradlew bootRun` can use it
# too; stop the standalone `postgres` container from the README first, or the port is taken.
services:
  db:
    image: postgres:16.2
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: store
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      # -h localhost forces TCP; during initdb a temporary server listens on the Unix socket only and would pass.
      test: ["CMD-SHELL", "pg_isready -h localhost -U admin -d store"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    image: ghcr.io/guyaogreen/online-store:latest
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/store
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
