server:
  compression:
    # The list responses are hundreds of kilobytes to megabytes of repetitive JSON (#9); gzip cuts them several-fold
    # for a client that sends Accept-Encoding. Tomcat's minimum size (2 KB by default) is only applied when the
    # Content-Length is known, and Spring streams JSON chunked, so in practice every JSON body is compressed.
    # Compression is between the application and its clients only; the database round trips the rest of #9 is about
    # are unaffected either way.
    enabled: true
    mime-types: application/json,application/problem+json
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/store
    username: admin
    password: admin
  jackson:
    deserialization:
      # Request DTOs list exactly the accepted fields; anything else (a client-supplied id, nested orders) is a 400.
      fail-on-unknown-properties: true
      # A fractional ID (7.9) must not be truncated onto a different row; it is an invalid value.
      accept-float-as-int: false
    parser:
      # A repeated key is a malformed body (400); without this Jackson reports it as a type definition error (500).
      strict-duplicate-detection: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        # Only health is on the wire (#11): the container HEALTHCHECK and the CI smoke check probe it. Its DataSource
        # check means UP also says the database is reachable, and because Liquibase runs before the web server accepts
        # connections, a 200 means the migrations applied. Component details stay hidden; they describe internals.
        include: health