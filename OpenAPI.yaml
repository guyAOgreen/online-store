openapi: 3.0.3
info:
  title: store
  version: '1.0'
  description: |
    A simple store: customers place orders, and an order contains one or more products.

    Every endpoint speaks JSON. Successful responses are `application/json`; every client error is an
    RFC 9457 problem document (`application/problem+json`) with the same five members, plus an `errors` array
    naming the offending field whenever one can be named (see the `ProblemDetail` schema).

    Status codes follow one rule across the API:

    * `400` means something is wrong with the request itself: malformed JSON, an unknown field (which is also
      how a client-supplied `id` is rejected), a missing or blank field, a value that is too long, a repeated
      product, or a path or query value that cannot be converted.
    * `404` means the resource named in the URL does not exist.
    * `415` means a create was sent with a `Content-Type` other than `application/json`.
    * `422` means the body is well formed but references a customer or product that does not exist.

    IDs are generated by the server and never accepted on a create. List responses are ordered by ID and are
    not paginated. The integration test suite validates every exchange it makes against this document, so the
    shapes here are the shapes the running service produces.
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: 'http://localhost:8080'
    description: Local development (`./gradlew bootRun` or `docker compose up`)
security: []
tags:
  - name: customers
    description: Customers and the orders they have placed
  - name: orders
    description: Orders, each for one customer and containing one or more products
  - name: products
    description: Products and the orders that contain them
paths:
  /customer:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List or search customers
      description: |
        Without `q`, every customer in ascending ID order, each with the ID and description of every order they
        have placed (ascending by order ID). With `q`, only the customers whose name contains every
        whitespace-separated word of `q` as a case-insensitive substring, in any order: `ann` matches
        `Dianne Lemke` and `Angelo Pfannerstill`; `ed glover` and `glover ed` both match only `Ed Glover`. A
        query that is empty or only whitespace is the same as no query. `%`, `_` and `\` match themselves. A
        query no name contains, including one holding a NUL character, returns an empty array; a search never
        fails with a client error.
      parameters:
        - name: q
          in: query
          required: false
          description: Words that must each appear, case-insensitively, somewhere in the customer's name.
          schema:
            type: string
          example: ann
      responses:
        '200':
          description: The matching customers, or every customer when `q` is absent or blank. May be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
              example:
                - id: 4
                  name: Dianne Lemke
                  orders:
                    - id: 5
                      description: Recycled Wooden Shoes
                    - id: 123
                      description: Incredible Concrete Salad
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      description: |
        Creates a customer with a server-generated ID. The body accepts `name` and nothing else: an `id` or a
        nested `orders` array is an unknown field and a `400`. Orders are created through `POST /order`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
            example:
              name: Ada Lovelace
      responses:
        '201':
          description: The customer as stored, with its generated ID and an empty order list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: 101
                name: Ada Lovelace
                orders: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /order:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List orders
      description: |
        Every order in ascending ID order, each with its customer and its products (ascending by product ID).
        An order created before products existed has an empty `products` array; see the `Order` schema.
      responses:
        '200':
          description: Every order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      description: |
        Creates an order for an existing customer containing one or more existing products, in one transaction:
        if any reference is invalid nothing is written. The ID is generated by the server. The same product may
        not be listed twice; quantities are outside the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            example:
              description: Reading lamp and chair
              customer:
                id: 1
              products:
                - id: 1
                - id: 2
      responses:
        '201':
          description: The order as stored, with its generated ID, its customer and its products in ascending ID order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 10001
                description: Reading lamp and chair
                customer:
                  id: 1
                  name: Muriel Donnelly
                products:
                  - id: 1
                    description: Lamp
                  - id: 2
                    description: Chair
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /order/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Fetch an order by ID
      description: One order with its customer and products; the same shape as one element of `GET /order`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 1
                description: Handcrafted Soft Chair
                customer:
                  id: 6
                  name: Vicki Kutch
                products: []
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products
      description: Every product in ascending ID order, each with the IDs of the orders that contain it.
      responses:
        '200':
          description: Every product. Empty on a fresh database, which seeds no products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - id: 1
                  description: Lamp
                  orders: [10001, 10002]
                - id: 2
                  description: Chair
                  orders: [10001]
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      description: |
        Creates a product with a server-generated ID. The body accepts `description` and nothing else; an `id`
        or an `orders` array is an unknown field and a `400`. Products are put into orders through `POST /order`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              description: Lamp
      responses:
        '201':
          description: The product as stored, with its generated ID and an empty order list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                description: Lamp
                orders: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Fetch a product by ID
      description: One product with the IDs of the orders that contain it; the same shape as one element of `GET /products`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                description: Lamp
                orders: [10001, 10002]
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: A server-generated ID. A value that is not a 64-bit integer is a `400`; one that matches no row is a `404`.
      schema:
        type: integer
        format: int64
      example: 1
  responses:
    BadRequest:
      description: |
        The request itself is invalid: malformed JSON, a repeated key, an unknown field (including `id`), a
        missing or blank field, a value over 255 characters or containing a NUL character, a fractional ID, an
        empty or missing `products` array, an element without an `id`, or the same product listed twice. `errors`
        names each field at fault when one can be named; malformed JSON gets a `detail` only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validation:
              summary: A field failed validation
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Invalid request content.
                instance: /order
                errors:
                  - field: customer.id
                    message: must not be null
            unknownField:
              summary: A client-supplied ID or any other field the request does not accept
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Unknown field 'id'
                instance: /customer
                errors:
                  - field: id
                    message: unknown field
            malformed:
              summary: The body is not JSON
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Malformed or missing request body
                instance: /customer
    InvalidId:
      description: The `id` in the path is not a 64-bit integer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Invalid value for 'id'
            instance: /order/abc
            errors:
              - field: id
                message: invalid value
    NotFound:
      description: No row has the `id` in the path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Order 999999 does not exist
            instance: /order/999999
    UnsupportedMediaType:
      description: The request body was not sent as `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: Content-Type 'text/plain;charset=UTF-8' is not supported.
            instance: /customer
    UnprocessableEntity:
      description: |
        The body is well formed but `customer.id` names a customer that does not exist, or one or more entries
        in `products` name products that do not exist. Every missing product ID is listed, in ascending order,
        so the request can be corrected in one round trip. Nothing is written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            customer:
              value:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Customer 999999 does not exist
                instance: /order
            products:
              value:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Products 7001, 7002 do not exist
                instance: /order
  schemas:
    Customer:
      title: Customer
      description: A customer with every order they have placed. The orders carry no customer or products, which keeps the graph finite.
      type: object
      additionalProperties: false
      required: [id, name, orders]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          description: Ascending by order ID; empty for a customer with no orders.
          items:
            $ref: '#/components/schemas/CustomerOrder'
    CustomerOrder:
      title: CustomerOrder
      description: An order as it appears inside a customer.
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
    Order:
      title: Order
      description: |
        An order with its customer and products. `products` is empty for an order created before products
        existed in the model (every seeded order, and any order created by a release before products): no
        association was invented for them, and clients must accept the empty array indefinitely. Orders created
        through this API always carry at least one product.
      type: object
      additionalProperties: false
      required: [id, description, customer, products]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        products:
          type: array
          description: Ascending by product ID, no product more than once.
          items:
            $ref: '#/components/schemas/OrderProduct'
    OrderCustomer:
      title: OrderCustomer
      description: A customer as it appears inside an order, without their other orders.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    OrderProduct:
      title: OrderProduct
      description: A product as it appears inside an order, without its other orders.
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
    Product:
      title: Product
      description: A product with the IDs of the orders that contain it.
      type: object
      additionalProperties: false
      required: [id, description, orders]
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          description: IDs of the orders containing this product, ascending, each once; empty for a product in no order.
          uniqueItems: true
          items:
            type: integer
            format: int64
    CustomerCreateRequest:
      title: CustomerCreateRequest
      description: Body of `POST /customer`. Any other property, including `id` and `orders`, is rejected.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Text'
    ProductCreateRequest:
      title: ProductCreateRequest
      description: Body of `POST /products`. Any other property, including `id` and `orders`, is rejected.
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description:
          $ref: '#/components/schemas/Text'
    OrderCreateRequest:
      title: OrderCreateRequest
      description: Body of `POST /order`. Any other property, including `id`, is rejected.
      type: object
      additionalProperties: false
      required: [description, customer, products]
      properties:
        description:
          $ref: '#/components/schemas/Text'
        customer:
          $ref: '#/components/schemas/CustomerReference'
        products:
          type: array
          description: The products in the order, at least one, each at most once. Order of the array does not matter.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductReference'
    CustomerReference:
      title: CustomerReference
      description: An existing customer, by ID. Any other property is rejected.
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    ProductReference:
      title: ProductReference
      description: An existing product, by ID. Any other property is rejected.
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    Text:
      title: Text
      description: |
        A name or description as stored in a `VARCHAR(255) NOT NULL` column: at least one non-whitespace
        character, at most 255 characters, and no NUL character (PostgreSQL cannot store one). The server counts
        the length in UTF-16 code units rather than code points, so a value holding characters outside the Basic
        Multilingual Plane (emoji, rare CJK) is limited to fewer than 255 of them: `maxLength` here is the upper
        bound, and such a value between 128 and 255 characters long may be rejected with a 400 although it fits
        this schema.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
    ProblemDetail:
      title: ProblemDetail
      description: |
        RFC 9457 problem details, the body of every client error. `errors` is present when a field can be named,
        with one entry per violation sorted by field; the field path is dotted, with array positions in brackets
        (`products[1].id`). Malformed JSON, a missing resource and a dangling reference carry a `detail` only.
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          description: Always `about:blank`; the status code carries the meaning.
          example: about:blank
        title:
          type: string
          description: The standard reason phrase of the status.
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request content.
        instance:
          type: string
          description: The request path.
          example: /order
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
                example: customer.id
              message:
                type: string
                example: must not be null
