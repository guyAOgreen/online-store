name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# Cancel superseded runs for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # Integration tests use Testcontainers; Docker is preinstalled on ubuntu-latest runners.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only runs on master write to the dependency cache; PR runs read from it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build, check and package
        run: ./gradlew clean check bootJar

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/test-results/integrationTest/
            build/reports/tests/integrationTest/
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: store-boot-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Builds the Docker image from the Dockerfile, smoke-tests it against PostgreSQL and, only for a push to master or a
  # v* tag, publishes it to GitHub Container Registry (#11). A pull request runs the same build and smoke test but
  # never logs in to the registry, so it needs no credentials and cannot publish. `needs: build` means a failed test
  # suite blocks the image, and the publish step comes after the smoke test, so a failed smoke test blocks it too.
  image:
    name: Build, smoke-test and publish image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: sha-<short sha> on every publish for commit traceability, latest on master, and the version for a v* tag.
      # Pull requests get pr-<n>, used locally only. The image name is lowercased for the registry.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image against PostgreSQL
        run: .github/scripts/smoke-test.sh "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context and cache as the build above, so this is a cache hit that only uploads the layers.
      - name: Publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
