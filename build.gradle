plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'org.liquibase.gradle' version '2.2.0'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

group = 'com.example'
version = '1.0.0-SNAPSHOT'

// Spring Boot 3.4.2 manages Testcontainers 1.20.4, whose Docker client is rejected by
// Docker Engine 29+ (minimum API version 1.44). 1.21.4 is the last 1.x and supports it.
ext['testcontainers.version'] = '1.21.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

spotless {
    java {
        palantirJavaFormat('2.50.0')
                .style('PALANTIR')
                .formatJavadoc(true)
        importOrder('com', 'jakarta', 'lombok', 'org', '', 'javax|java', '\\#')
        removeUnusedImports()
        formatAnnotations()
    }
}

// Database-backed tests live in src/integrationTest and need Docker (Testcontainers).
// `./gradlew test` stays fast and database-free; `./gradlew check` runs both suites.
testing {
    suites {
        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                        finalizedBy tasks.jacocoTestReport
                        // The latency benchmark reports timings rather than asserting them; see latencyBenchmark.
                        filter.excludeTestsMatching 'com.example.store.LatencyBenchmarkIntegrationTest'
                    }
                }
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('check') {
    dependsOn testing.suites.integrationTest
}

// Measures every GET endpoint against PostgreSQL behind a Toxiproxy latency toxic (#9) and writes
// build/reports/latency-benchmark.md. Not part of check: it reports timings, which no CI run should gate on.
tasks.register('latencyBenchmark', Test) {
    description = 'Measures the GET endpoints with simulated database latency (-Platency=<ms>, default 25).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    filter.includeTestsMatching 'com.example.store.LatencyBenchmarkIntegrationTest'
    systemProperty 'store.benchmark.latency', project.findProperty('latency') ?: '25'
    outputs.upToDateWhen { false }
    jacoco.enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.2'
    implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    // Test dependencies
    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    // Integration test dependencies (versions come from the Spring Boot BOM)
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:toxiproxy'
    integrationTestCompileOnly 'org.projectlombok:lombok'
    integrationTestAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

tasks.jacocoTestReport {
    dependsOn tasks.test // Ensure tests run before generating the report

    // Merge coverage from every test suite that has run (test.exec, integrationTest.exec).
    executionData fileTree(layout.buildDirectory.dir('jacoco')) { include '*.exec' }

    reports {
        html.required.set(true)
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['**/mapper/**', '**/StoreApplication.class'])
        })
    }
}